name: electrical-commerce
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: electrical
      POSTGRES_USER: electrical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electrical -d electrical"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://electrical:${POSTGRES_PASSWORD}@db:5432/electrical?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://electrical:${POSTGRES_PASSWORD}@db:5432/electrical?schema=public
      ALLOW_CATALOGUE_SNAPSHOT: "false"
      CORS_ORIGINS: http://localhost:${STORE_PORT:-3000},http://127.0.0.1:${STORE_PORT:-3000},http://localhost:${ADMIN_PORT:-3001},http://127.0.0.1:${ADMIN_PORT:-3001}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: ../electrical-frontend
      args:
        API_URL: http://backend:4000/api
    environment:
      API_URL: http://backend:4000/api
    ports:
      - "127.0.0.1:${STORE_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
  admin:
    build:
      context: ../electrical-admin-panel
    environment:
      API_URL: http://backend:4000/api
      STOREFRONT_URL: http://localhost:${STORE_PORT:-3000}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
